<!DOCTYPE html>
<html>
<head>

<title>Cloud IDS Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

body{
background:#0f172a;
color:#e2e8f0;
font-family:Arial;
margin:0;
padding:0;
}

.header{
background:#020617;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:10px;
text-align:center;
font-size:20px;
}

.card h2{
margin:10px 0;
}

.ddos{ border-left:6px solid #ef4444; }
.brute{ border-left:6px solid #f59e0b; }
.alerts{ border-left:6px solid #38bdf8; }
.blocked{ border-left:6px solid #22c55e; }

.charts{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
padding:20px;
}

.chart-box{
background:#1e293b;
padding:20px;
border-radius:10px;
}

.map-box{
background:#1e293b;
padding:20px;
margin:20px;
border-radius:10px;
}

#map{
height:450px;
border-radius:8px;
}

</style>

</head>

<body>

<div class="header">
🚀 SecureShop Cloud IDS Dashboard
</div>

<div class="container">

<div class="card alerts">
<h3>Total Alerts</h3>
<h2 id="alerts">0</h2>
</div>

<div class="card ddos">
<h3>DDoS Attacks</h3>
<h2 id="ddos">0</h2>
</div>

<div class="card brute">
<h3>Brute Force</h3>
<h2 id="brute">0</h2>
</div>

<div class="card blocked">
<h3>Blocked IPs</h3>
<h2 id="blocked">0</h2>
</div>

</div>

<div class="charts">

<div class="chart-box">
<h3>Attack Timeline</h3>
<canvas id="timelineChart"></canvas>
</div>

<div class="chart-box">
<h3>Top Attacking IPs</h3>
<canvas id="ipChart"></canvas>
</div>

</div>

<!-- ✅ NEW CHARTS -->
<div class="charts">

<div class="chart-box">
<h3>ML vs Rule-Based Attacks</h3>
<canvas id="mlChart"></canvas>
</div>

<div class="chart-box">
<h3>Attack Distribution</h3>
<canvas id="attackChart"></canvas>
</div>

</div>

<div class="map-box">
<h3>🌍 Global Attack Map</h3>
<div id="map"></div>
</div>

<script>

let timelineChart, ipChart, mlChart, attackChart

// ================= MAP =================
let map = L.map('map').setView([20,0],2)

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:18
}).addTo(map)

let serverLat = 20.5937
let serverLon = 78.9629

L.circleMarker([serverLat,serverLon],{
radius:8,color:"#22c55e",fillColor:"#22c55e",fillOpacity:1
}).addTo(map).bindPopup("Protected Server")

// ================= DATA =================
async function loadData(){

let res = await fetch("/admin/live-data")
let data = await res.json()

document.getElementById("alerts").innerText = data.total_alerts
document.getElementById("ddos").innerText = data.ddos_attacks
document.getElementById("brute").innerText = data.brute_force_attacks
document.getElementById("blocked").innerText = data.blocked_ips.length

// Timeline
let times = Object.keys(data.timeline)
let counts = Object.values(data.timeline)

if(!timelineChart){
timelineChart = new Chart(document.getElementById("timelineChart"),{
type:"line",
data:{labels:times,datasets:[{label:"Attacks",data:counts}]}
})
}else{
timelineChart.data.labels = times
timelineChart.data.datasets[0].data = counts
timelineChart.update()
}

// IP Chart
let ips = data.top_ips.map(i=>i[0])
let ipCounts = data.top_ips.map(i=>i[1])

if(!ipChart){
ipChart = new Chart(document.getElementById("ipChart"),{
type:"bar",
data:{labels:ips,datasets:[{label:"Attack Count",data:ipCounts}]}
})
}else{
ipChart.data.labels = ips
ipChart.data.datasets[0].data = ipCounts
ipChart.update()
}

// ================= ML vs RULE =================
if(!mlChart){
mlChart = new Chart(document.getElementById("mlChart"),{
type:"pie",
data:{
labels:["ML","Rule"],
datasets:[{data:[data.ml_attacks,data.rule_attacks]}]
}
})
}else{
mlChart.data.datasets[0].data = [data.ml_attacks,data.rule_attacks]
mlChart.update()
}

// ================= ATTACK TYPES =================
if(!attackChart){
attackChart = new Chart(document.getElementById("attackChart"),{
type:"bar",
data:{
labels:["DDoS","Brute Force"],
datasets:[{data:[data.ddos_attacks,data.brute_force_attacks]}]
}
})
}else{
attackChart.data.datasets[0].data = [data.ddos_attacks,data.brute_force_attacks]
attackChart.update()
}

}

// ================= MAP =================
async function loadAttackMap(){

let res = await fetch("/admin/attack-map")
let data = await res.json()

data.forEach(a=>{
let marker = L.circleMarker([a.lat,a.lon],{
radius:6,color:"#ef4444",fillOpacity:0.8
}).addTo(map)

marker.bindPopup("IP: "+a.ip+"<br>"+a.type)

L.polyline([[a.lat,a.lon],[serverLat,serverLon]],{
color:"#ff0000",weight:2,opacity:0.7
}).addTo(map)
})
}

// ================= AUTO =================
loadData()
loadAttackMap()

setInterval(loadData,2000)
setInterval(loadAttackMap,8000)

</script>

</body>
</html>
